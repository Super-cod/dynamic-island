name: CI & Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore WindowsDynamicBar.sln -m:1

      - name: Build Solution (Release)
        run: dotnet build WindowsDynamicBar.sln -c Release --no-restore

      - name: Run Automated Test Suite
        run: dotnet run --project tests\WindowsDynamicBar.Tests\WindowsDynamicBar.Tests.csproj -c Release --no-build

      - name: Publish Self-Contained Win-x64 Executable
        run: >
          dotnet publish src\WindowsDynamicBar\WindowsDynamicBar.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=false
          -o release\publish

      - name: Archive Portable Release Package
        shell: pwsh
        run: |
          Compress-Archive -Path "release\publish\*" -DestinationPath "release\WindowsDynamicBar-Portable-win-x64.zip" -CompressionLevel Optimal
          Get-FileHash -Path "release\WindowsDynamicBar-Portable-win-x64.zip" -Algorithm SHA256 | Out-File -FilePath "release\checksums.txt" -Encoding utf8

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsDynamicBar-Portable-win-x64
          path: |
            release/WindowsDynamicBar-Portable-win-x64.zip
            release/checksums.txt
          if-no-files-found: error
